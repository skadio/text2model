[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2model"
version = "1.3.3"
description = "LLM Modeling Copilots for Text-to-Model Translation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["minizinc", "constraint-programming", "LLM", "text-to-model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai",
    "datasets",
    "tqdm",
    "langchain-ollama",
    "flet==0.21.2",
    "pytest",
]

# Optional: local Hugging Face / unsloth models (see Fine-tuned Models in the
# README). Requires an NVIDIA or Intel GPU. Install with:
#   pip install "text2model[gpu]" --extra-index-url https://download.pytorch.org/whl/cu126
# Pinned exactly (not just floored) because unsloth/transformers/peft/torch
# move fast and break each other across releases; this combination is
# verified working end-to-end (model load + real generation) via a clean
# `pip` resolve, no --no-deps needed.
[project.optional-dependencies]
gpu = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "xformers==0.0.31",
    "triton==3.3.1",
    "bitsandbytes==0.49.2",
    "transformers==4.56.2",
    "huggingface_hub==0.36.2",
    "peft==0.18.0",
    "accelerate==1.14.0",
    "trl==0.23.0",
    "datasets==4.3.0",
    "diffusers==0.39.0",
    "unsloth==2025.12.1",
    "unsloth_zoo==2025.12.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real external dependency (OpenAI API, MiniZinc binary). Skipped automatically when the credential/binary is missing, and always excluded in CI.",
]

[project.scripts]
text2model = "text2model.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["text2model*"]

[tool.setuptools]
license-files = []

[tool.setuptools.package-data]
"text2model" = [
    "prompts/*.txt",
    "prompts/global_constraint_prompts/*.txt",
    "grammar.mzn",
    "knowledge_graphs/*.ttl",
]
